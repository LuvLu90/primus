[package]
name = "primus"
version = "0.0.5"
edition = "2024"
rust-version = "1.99"
description = "乾元（Primus）薄壳"

[lib]
name = "primus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# 依赖随对应模块落地时加入（其余如 tokio、gix、windows 等以后再加），版本以技术方案第 2.4 节为准。
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
# 系统文件/文件夹对话框（dialog_pick_folder / dialog_pick_files，附录 B）
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
# 会话索引（第 10.2 节、ADR 0006）：bundled 内置 SQLite（含 FTS5 与 trigram 分词器），不依赖系统库
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# 会话目录监听（fs_watch）
notify = "=8.2.0"

# Windows 平台层（第 4.3 节 ACL、第 3.7 节修复引导、第 2.2 节 Job Object）：只用 windows-sys 的原始 FFI，版本见技术方案第 2.4 节
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
