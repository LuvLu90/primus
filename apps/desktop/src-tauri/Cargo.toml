[package]
name = "primus"
version = "0.0.6"
edition = "2024"
rust-version = "1.99"
description = "乾元（Primus）薄壳"

[lib]
name = "primus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# 依赖随对应模块落地时加入（其余如 tokio、gix、windows 等以后再加），版本以技术方案第 2.4 节为准。
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
# 系统文件/文件夹对话框（dialog_pick_folder / dialog_pick_files，附录 B）
tauri-plugin-dialog = "=2.8.3"
# 自动更新（第 3.6 节、ADR 0007）：只在 Rust 侧使用（不给 WebView 开插件权限）；只用到 Windows 的 MSI / NSIS 安装包，不要 zip
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# 待装包二次校验（安装前从磁盘重读，按 updater 插件同一套 minisign 规则校验）：与插件依赖树中的版本一致
minisign-verify = "=0.3.0"
base64 = "=0.23.1"
# 更新版本比较（SemVer，含预发布）：与 Tauri 依赖树中的版本一致
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
# 会话索引（第 10.2 节、ADR 0006）：bundled 内置 SQLite（含 FTS5 与 trigram 分词器），不依赖系统库
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# 会话目录监听（fs_watch）
notify = "=8.2.0"
# 工作区信任：`.primus/` 内容指纹（第 17.2 节），与 Tauri 依赖树中的版本一致
sha2 = "=0.10.9"

# Windows 平台层（第 4.3 节 ACL、第 3.7 节修复引导、第 2.2 节 Job Object）：只用 windows-sys 的原始 FFI，版本见技术方案第 2.4 节
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
