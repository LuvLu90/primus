# 乾元 Primus 发布（技术方案第 3.1、22 章）：按标签为 Windows x64 与 ARM64 各构建 MSI 与 NSIS 安装程序（EXE），
# 发布到 GitHub Releases
# - 推送 v* 标签时自动运行；Release 不存在则创建。版本含预发布标识（含 '-'，如 1.2.0-beta.1）时标为 prerelease，
#   否则为正式版并设为 Latest
# - workflow_dispatch 输入已有标签（例如 v0.0.1），重新构建该标签并更新对应 Release：同名附件覆盖上传
#   （失败时回滚到旧附件），不在本次清单中的旧附件（例如早期的 SBOM、.sha256）删除，prerelease / Latest 按上一条规则更正
# - Release 附件：Primus_<ver>_<x64|arm64>_zh-CN.msi 与 Primus_<ver>_<x64|arm64>-setup.exe 共 4 个安装包，及各自的
#   updater 签名 .sig 共 4 个（自签名时另加两个架构的公钥证书 .cer）；SBOM 与被禁 SDK 检查、安装包检查、静默安装 / 卸载冒烟
#   照常在构建作业中运行，但不作为附件，SHA-256 写在 Release 正文
# - 自动更新（技术方案第 3.6 节、ADR 0007）：每次发布都必须配置仓库 Secret TAURI_SIGNING_PRIVATE_KEY /
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD / TAURI_SIGNING_PUBLIC_KEY（`pnpm tauri signer generate` 生成），缺一即失败；
#   公钥在编译时注入 Primus.exe，私钥给 4 个安装包生成 .sig。发布作业随后用 scripts/gen-update-manifest.mjs 生成
#   Tauri 静态清单，上传到固定的 Release `update-feed`（prerelease、不设 Latest）：正式版更新 stable.json 与 beta.json
#   （beta 只在本版本更高时覆盖），预发布只更新 beta.json；现有清单版本更高时不覆盖（重建旧标签不会让通道回退）
# - 两个架构都构建并冒烟成功后才发布（发布作业 needs 整个矩阵）
# - 工作流本身来自触发它的提交（手动触发时为 main），构建的源码一律 checkout 该标签；
#   共用的 composite action 从工作流自身的提交另行取出。标签中须已有多架构打包脚本（scripts/build-nsis.mjs 等），
#   更早的标签无法用本工作流构建；早于 RPC 契约测试的标签（package.json 无 contract:core:dist）可以构建，
#   但跳过契约测试一步（RPC 冒烟照常运行）
# - 代码签名（scripts/import-release-signing.ps1）：默认在构建运行器上临时生成本次发布专用的自签名证书（私钥不可导出、
#   不保存，不写进仓库也不用 Secret），签 Primus.exe、MSI、setup.exe。两个架构的作业各自生成证书，各自导出公钥证书
#   Primus-signing-cert-<x64|arm64>.cer 作为附件，正文写明按安装包架构导入对应证书
#   （临时生成时每个版本、每个架构的证书都不同）。以后有正式证书时配置仓库 Secret PRIMUS_SIGN_PFX_BASE64 / PASSWORD；
#   updater 密钥（TAURI_SIGNING_*）与代码签名证书无关，任何情况下都必须配置；CA 签发的证书不附 .cer；
#   PFX 中若是自签名证书，两个架构共用这一张，仍附两个（内容相同的）.cer，正文按证书来源说明
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已有标签（例如 v0.0.1），构建该标签并更新对应 Release 的附件
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: 构建安装包（Windows ${{ matrix.arch }}）
    strategy:
      # 任一架构失败即整体失败，不发布只有部分架构的 Release
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          # GitHub 托管的 Windows 11 ARM64 运行器：原生编译 aarch64-pc-windows-msvc，并能实际安装冒烟
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signed: ${{ steps.signing.outputs.signed }}
      selfsigned: ${{ steps.signing.outputs.selfsigned }}
      certsource: ${{ steps.signing.outputs.certsource }}
    steps:
      - name: 校验标签名
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "标签须为 v<SemVer>（例如 v0.0.1、v1.2.0-beta.1），实际：$env:RELEASE_TAG"
          }

      - name: 检出标签 ${{ env.RELEASE_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: 取出工作流提交中的共用 action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: 校验标签版本与 tauri.conf.json 一致
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -cne $env:RELEASE_TAG) {
            throw "标签 $env:RELEASE_TAG 与 tauri.conf.json 的版本 $version 不一致"
          }
          # 只有带预发布标识（含 '-'）的版本才标为 prerelease；其余为正式版
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          $wix = (Get-Content -Raw scripts/version-baseline.json | ConvertFrom-Json).toolchain.wix
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "wix=$wix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本 $version · prerelease=$prerelease · WiX $wix · 架构 $env:ARCH"
        env:
          ARCH: ${{ matrix.arch }}

      - name: 检查标签中含多架构打包与自动更新脚本
        shell: pwsh
        run: |
          $required = 'scripts/build-nsis.mjs', 'scripts/check-installers.ps1', 'scripts/nsis-smoke.ps1'
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw "标签 $env:RELEASE_TAG 中缺少 $($missing -join '、')：该标签早于多架构 MSI + NSIS 打包，不能用本工作流构建"
          }
          # setup.exe 的 .sig 由 build-nsis.mjs 生成；更早的标签只能给 MSI 签名，发布不出完整的自动更新附件
          if (-not (Test-Path -LiteralPath 'scripts/gen-update-manifest.mjs')) {
            throw "标签 $env:RELEASE_TAG 中缺少 scripts/gen-update-manifest.mjs：该标签早于自动更新，不能用本工作流构建"
          }

      # 自动更新（ADR 0007）：每次发布都必须有 updater 密钥。公钥编译进 Primus.exe（没有公钥的构建禁用自动更新），
      # 私钥给安装包生成 .sig；缺一即失败，不发布无法自动更新的版本
      - name: 检查 updater 签名密钥（自动更新）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          $missing = @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD', 'TAURI_SIGNING_PUBLIC_KEY' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "缺少仓库 Secret：$($missing -join '、')。自动更新要求每次发布都配置 updater 密钥（pnpm tauri signer generate 生成）"
          }

      # 发布构建不启用 pnpm / Rust 缓存，产物只取决于标签内容与锁文件
      - name: 准备 Windows 构建环境（WiX ${{ steps.version.outputs.wix }}）
        uses: ./.release-ci/.github/actions/setup-windows-build
        with:
          wix-version: ${{ steps.version.outputs.wix }}
          cache: "false"

      # 未配置 Secret 时临时生成自签名证书；配一半报错。PFX 只在这一步可见。
      # 早于发布签名的标签（没有 import-release-signing.ps1，其构建脚本也不认签名配置）重建时按未签名发布；
      # 但已配置正式证书 Secret 时不允许静默降级为未签名
      - name: 准备代码签名证书
        id: signing
        shell: pwsh
        env:
          PRIMUS_SIGN_PFX_BASE64: ${{ secrets.PRIMUS_SIGN_PFX_BASE64 }}
          PRIMUS_SIGN_PFX_PASSWORD: ${{ secrets.PRIMUS_SIGN_PFX_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          if (-not (Test-Path -LiteralPath scripts/import-release-signing.ps1)) {
            if ($env:PRIMUS_SIGN_PFX_BASE64 -or $env:PRIMUS_SIGN_PFX_PASSWORD) {
              throw "标签 $env:RELEASE_TAG 中缺少 scripts/import-release-signing.ps1：该标签早于发布签名，已配置签名证书 Secret 时不能按未签名重建"
            }
            Write-Host "::notice::标签 $env:RELEASE_TAG 早于发布签名（无 scripts/import-release-signing.ps1），按未签名构建"
            "signed=false", "selfsigned=false", "certsource=none" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          ./scripts/import-release-signing.ps1 -Version $env:VERSION -Arch $env:ARCH
          $signed = (Get-Content -Raw $env:GITHUB_ENV) -match '(?m)^PRIMUS_RELEASE_SIGNED=true\r?$'
          $self = (Get-Content -Raw $env:GITHUB_ENV) -match '(?m)^PRIMUS_RELEASE_SELF_SIGNED=true\r?$'
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "selfsigned=$($self.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # 证书来源：generated（本次临时生成，每个架构各一张）或 pfx（Secret 中的同一张证书）
          $source = [regex]::Matches((Get-Content -Raw $env:GITHUB_ENV), '(?m)^PRIMUS_RELEASE_CERT_SOURCE=(generated|pfx)\r?$') | Select-Object -Last 1
          if (-not $source) { throw "import-release-signing.ps1 未写入 PRIMUS_RELEASE_CERT_SOURCE" }
          "certsource=$($source.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 内置 Node 运行时按目标架构下载（scripts/node-runtime.json 锁定 win-x64 / win-arm64 的哈希）
      - name: 构建 Agent Core 并组装 dist/（运行时 win-${{ matrix.arch }}）
        run: node scripts/build-core.mjs --platform win-${{ matrix.arch }}
      - name: Agent Core RPC 冒烟（dist/runtime/node.exe + dist/agent-core）
        run: pnpm smoke:core:dist
      # 早于 RPC 契约测试的标签（package.json 没有 contract:core:dist）重建时跳过此步，冒烟照常运行
      - name: 检查标签中含 RPC 契约测试
        id: contract
        shell: pwsh
        run: |
          $scripts = (Get-Content -Raw package.json | ConvertFrom-Json).scripts
          $present = ($null -ne $scripts.PSObject.Properties['contract:core:dist']).ToString().ToLowerInvariant()
          "present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($present -ne 'true') { Write-Host "::notice::标签 $env:RELEASE_TAG 早于 RPC 契约测试（package.json 无 contract:core:dist），跳过契约测试" }
      - name: Agent Core RPC 契约测试（dist/runtime/node.exe + dist/agent-core）
        if: steps.contract.outputs.present == 'true'
        run: pnpm contract:core:dist
      - name: 构建第一方扩展（primus-bundle.js）
        run: pnpm build:extensions
      - name: 生成 SBOM（CycloneDX；只做检查，不作为 Release 附件）
        run: pnpm build:sbom
      - name: 被禁 SDK 检查（导入图 + SBOM，严格模式）
        run: node scripts/check-forbidden-sdk.mjs --strict

      # updater 密钥只给这两步：TAURI_SIGNING_PUBLIC_KEY 在 tauri build 编译 Primus.exe 时注入（build.rs 的
      # rerun-if-env-changed + option_env!），私钥给 MSI 与 setup.exe 生成 .sig；PRIMUS_REQUIRE_UPDATER_SIGNING=1
      # 让构建脚本在密钥缺失时拒绝构建（配置了 PFX Secret 时另有 PRIMUS_REQUIRE_SIGNING=1）
      - name: 构建 MSI（tauri build --no-bundle → wix build -arch ${{ matrix.arch }}）
        run: node scripts/build-msi.mjs --arch ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          PRIMUS_REQUIRE_UPDATER_SIGNING: "1"
      - name: 构建 NSIS 安装程序（tauri bundle --bundles nsis）
        run: node scripts/build-nsis.mjs --arch ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          PRIMUS_REQUIRE_UPDATER_SIGNING: "1"

      - name: 检查安装包（文件名、大小、校验、MSI 平台、Primus.exe 架构）
        shell: pwsh
        run: ./scripts/check-installers.ps1 -Arch ${{ matrix.arch }}

      # GitHub 托管运行器以管理员运行；未装 gsudo，跳过中完整性级别写入测试（ACL 仍检查）
      - name: MSI 静默安装 / 卸载冒烟
        shell: pwsh
        run: ./scripts/msi-smoke.ps1 -Msi $env:PRIMUS_MSI
      - name: NSIS 静默安装 / 卸载冒烟
        shell: pwsh
        run: ./scripts/nsis-smoke.ps1 -Exe $env:PRIMUS_NSIS

      - name: 汇集发布附件
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "release-assets-$env:ARCH"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # 安装包及其 updater 签名（自动更新的清单引用 .sig 内容）
          $files = @($env:PRIMUS_MSI, "$env:PRIMUS_MSI.sig", $env:PRIMUS_NSIS, "$env:PRIMUS_NSIS.sig")
          foreach ($sig in "$env:PRIMUS_MSI.sig", "$env:PRIMUS_NSIS.sig") {
            if (-not (Test-Path -LiteralPath $sig)) { throw "缺少 updater 签名 $sig" }
          }
          # 自签名证书由各架构作业各自生成：每个作业附上自己导出的公钥证书 Primus-signing-cert-<arch>.cer
          if ($env:PRIMUS_RELEASE_SELF_SIGNED -eq 'true') {
            if ((Split-Path -Leaf $env:PRIMUS_SIGN_CER) -cne "Primus-signing-cert-$env:ARCH.cer") {
              throw "公钥证书文件名应为 Primus-signing-cert-$env:ARCH.cer，实际 $env:PRIMUS_SIGN_CER"
            }
            $files += $env:PRIMUS_SIGN_CER
          }
          $lines = foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $dir
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          # 校验清单只在作业之间传递（发布作业据此核对），不上传到 Release；LF 行尾供 sha256sum 读取
          [IO.File]::WriteAllText((Join-Path $dir "SHA256SUMS-$env:ARCH.txt"), (($lines -join "`n") + "`n"))
          Get-ChildItem $dir | Select-Object Name, Length
          "RELEASE_ASSETS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 上传发布附件（供发布作业使用）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.arch }}
          path: ${{ env.RELEASE_ASSETS }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 共享的 update-feed 清单“读取 → 比较 → 上传”必须串行：不同标签的发布作业若并发，较旧版本可能读到旧清单后
    # 覆盖较新版本刚上传的清单。所有标签的发布作业共用一个并发组，同一时刻只有一个在运行，后来的排队等待。
    # queue: max 让排队中的作业都保留（默认 single 每组只留一个，连发多个标签时中间排队的会被取代）；不能与 cancel-in-progress: true 同用
    concurrency:
      group: release-publish-update-feed
      cancel-in-progress: false
      queue: max
    # 仅发布作业持有写权限；构建作业只读
    permissions:
      contents: write
    steps:
      # 生成自动更新清单的脚本取自工作流自身的提交（与构建作业的共用 action 同一做法），不依赖标签内容
      - name: 取出工作流提交中的清单脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: assets

      - name: 核对附件清单与 SHA-256
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SELF_SIGNED: ${{ needs.build.outputs.selfsigned }}
        run: |
          set -euo pipefail
          cd assets
          want=(
            "Primus_${VERSION}_arm64-setup.exe"
            "Primus_${VERSION}_arm64-setup.exe.sig"
            "Primus_${VERSION}_arm64_zh-CN.msi"
            "Primus_${VERSION}_arm64_zh-CN.msi.sig"
            "Primus_${VERSION}_x64-setup.exe"
            "Primus_${VERSION}_x64-setup.exe.sig"
            "Primus_${VERSION}_x64_zh-CN.msi"
            "Primus_${VERSION}_x64_zh-CN.msi.sig"
          )
          [[ "$SELF_SIGNED" == "true" ]] && want+=("Primus-signing-cert-arm64.cer" "Primus-signing-cert-x64.cer")
          expected="$(printf '%s\n' "${want[@]}" | LC_ALL=C sort)"
          actual="$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*.txt' -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::附件清单不符。期望："; echo "$expected"; echo "实际："; echo "$actual"; exit 1
          fi
          cat SHA256SUMS-x64.txt SHA256SUMS-arm64.txt > ../SHA256SUMS.txt
          [[ "$(wc -l < ../SHA256SUMS.txt)" -eq "${#want[@]}" ]] || { echo "::error::校验清单应有 ${#want[@]} 行"; exit 1; }
          sha256sum --check --strict ../SHA256SUMS.txt

      - name: 创建 Release 或更新附件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SIGNED: ${{ needs.build.outputs.signed }}
          SELF_SIGNED: ${{ needs.build.outputs.selfsigned }}
          CERT_SOURCE: ${{ needs.build.outputs.certsource }}
        run: |
          set -euo pipefail
          names=(
            "Primus_${VERSION}_x64_zh-CN.msi"
            "Primus_${VERSION}_arm64_zh-CN.msi"
            "Primus_${VERSION}_x64-setup.exe"
            "Primus_${VERSION}_arm64-setup.exe"
            "Primus_${VERSION}_x64_zh-CN.msi.sig"
            "Primus_${VERSION}_arm64_zh-CN.msi.sig"
            "Primus_${VERSION}_x64-setup.exe.sig"
            "Primus_${VERSION}_arm64-setup.exe.sig"
          )
          [[ "$SELF_SIGNED" == "true" ]] && names+=("Primus-signing-cert-x64.cer" "Primus-signing-cert-arm64.cer")
          files=()
          for n in "${names[@]}"; do files+=("assets/${n}"); done

          # 正文的「## 校验」段：全部附件（安装包与自签名公钥证书）的 SHA-256
          {
            printf '## 校验\n\n| 文件 | SHA-256 |\n| --- | --- |\n'
            for n in "${names[@]}"; do
              printf '| `%s` | `%s` |\n' "$n" "$(awk -v n="$n" '$2 == n { print $1 }' SHA256SUMS.txt)"
            done
            printf '\n```powershell\nGet-FileHash .\\<文件名> -Algorithm SHA256\n```\n'
          } > checksums.md
          if grep -Eq '\| `[0-9a-f]{0,63}` \|' checksums.md; then echo "::error::校验表缺少哈希"; exit 1; fi

          # 正文的「## 已知限制」与「## 安装包」段随签名状态生成：创建时写入，更新已有 Release 时整段替换，
          # 重跑同一标签后正文与本次附件的签名状态一致
          {
            printf '## 已知限制\n\n'
            if [[ "$SELF_SIGNED" == "true" && "$CERT_SOURCE" == "generated" ]]; then
              printf -- '- **自签名证书**：x64 与 ARM64 安装包分别用本版本、本架构专用的自签名证书签名（每个版本、每个架构的证书都不同），'
              printf '只在导入了对应证书的电脑上显示为已验证的发布者：x64 安装包对应 `Primus-signing-cert-x64.cer`，ARM64 安装包对应 `Primus-signing-cert-arm64.cer`。'
              printf '导入方法（管理员 PowerShell，文件名换成对应架构的证书）：`Import-Certificate -FilePath .\\Primus-signing-cert-x64.cer -CertStoreLocation Cert:\\LocalMachine\\Root`，'
              printf '再对 `Cert:\\LocalMachine\\TrustedPublisher` 执行一次。SmartScreen 按下载信誉判断，导入后首次运行仍可能拦截，需要点「更多信息」→「仍要运行」。\n'
            elif [[ "$SELF_SIGNED" == "true" ]]; then
              printf -- '- **自签名证书**：x64 与 ARM64 安装包用项目配置的同一张自签名证书签名（`Primus-signing-cert-x64.cer` 与 `Primus-signing-cert-arm64.cer` 内容相同，导入其中一张即可），'
              printf '只在导入了该证书的电脑上显示为已验证的发布者。'
              printf '导入方法（管理员 PowerShell）：`Import-Certificate -FilePath .\\Primus-signing-cert-x64.cer -CertStoreLocation Cert:\\LocalMachine\\Root`，'
              printf '再对 `Cert:\\LocalMachine\\TrustedPublisher` 执行一次。SmartScreen 按下载信誉判断，导入后首次运行仍可能拦截，需要点「更多信息」→「仍要运行」。\n'
            elif [[ "$SIGNED" == "true" ]]; then
              printf -- '- 安装包已做代码签名；新证书积累 SmartScreen 信誉之前，首次运行仍可能被拦截。\n'
            else
              printf -- '- **未做代码签名**：首次运行安装包时 Windows SmartScreen 会拦截，需要点「更多信息」→「仍要运行」。\n'
            fi
          } > limits.md
          {
            printf '## 安装包\n\n'
            printf -- '- `%s`、`%s`：MSI 安装包（简体中文，x64 / ARM64）\n' "${names[0]}" "${names[1]}"
            printf -- '- `%s`、`%s`：NSIS 安装程序（简体中文，x64 / ARM64）\n' "${names[2]}" "${names[3]}"
            printf -- '- `*.sig`：上面 4 个安装包的自动更新签名（应用内自动更新下载后据此校验，手动安装用不到）\n'
            if [[ "$SELF_SIGNED" == "true" ]]; then
              printf -- '- `%s`、`%s`：自签名代码签名证书（仅公钥，x64 / ARM64 安装包各用其一），见「已知限制」\n' "${names[8]}" "${names[9]}"
            fi
          } > packages.md

          # 只有预发布版本标 prerelease；正式版取消 prerelease 并设为 Latest
          if [[ "$PRERELEASE" == "true" ]]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--prerelease=false --latest)
          fi

          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} 已存在：更新附件（prerelease=${PRERELEASE}）"
            existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            # --clobber 先删旧附件再上传：先备份同名旧附件，上传失败时整组回滚，避免 Release 缺安装包
            mkdir -p backup
            for n in "${names[@]}"; do
              if grep -Fxq -- "$n" <<<"$existing"; then
                gh release download "$RELEASE_TAG" --pattern "$n" --dir backup
              fi
            done
            if ! gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then
              echo "::error::附件上传失败，回滚到上传前的附件"
              for n in "${names[@]}"; do
                if [[ -f "backup/$n" ]]; then
                  gh release upload "$RELEASE_TAG" "backup/$n" --clobber || echo "::error::恢复旧附件 $n 失败"
                elif gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq -- "$n"; then
                  # 上传前不存在的附件：删掉本次留下的新版本，保持整组一致
                  gh release delete-asset "$RELEASE_TAG" "$n" --yes || echo "::error::删除新附件 $n 失败"
                fi
              done
              exit 1
            fi
            # 新附件齐全后先更新正文与发布状态（有限重试，仍失败则步骤失败），全部成功后才删除不在本次清单中的旧附件
            # （例如早期发布的 SBOM 与 .sha256）：中途失败时旧附件仍在，重新运行工作流即可恢复
            retry() {
              local i
              for i in 1 2 3; do
                "$@" && return 0
                echo "::warning::第 ${i} 次失败：$*" >&2
                sleep $((i * 10))
              done
              return 1
            }
            # 正文：替换「## 已知限制」「## 安装包」「## 校验」三段（各到下一个二级标题或结尾为止）；
            # 前两段没有则加在正文开头，校验段没有则追加；其余正文（自动生成的变更说明等）不动
            retry gh release view "$RELEASE_TAG" --json body --jq .body > body.md \
              || { echo "::error::读取 Release 正文失败"; exit 1; }
            LIMITS="$(cat limits.md)" PACKAGES="$(cat packages.md)" CHECKSUMS="$(cat checksums.md)" perl -0pi -e '
              my $head = "";
              for my $pair (["已知限制", $ENV{LIMITS}], ["安装包", $ENV{PACKAGES}]) {
                my ($title, $text) = @$pair;
                my $section = "$text\n\n";
                $head .= $section unless s/^##[ \t]*\Q$title\E[ \t]*\r?\n.*?(?=^##[ \t]|\z)/$section/ms;
              }
              $_ = $head . $_ if $head ne "";
              my $section = "$ENV{CHECKSUMS}\n\n";
              if (!s/^##[ \t]*校验[ \t]*\r?\n.*?(?=^##[ \t]|\z)/$section/ms) {
                s/\s*\z/\n\n$section/;
              }
              s/\s*\z/\n/;
            ' body.md
            retry gh release edit "$RELEASE_TAG" --draft=false "${channel[@]}" --notes-file body.md \
              || { echo "::error::更新 Release 正文与发布状态失败，旧附件保留"; exit 1; }
            while IFS= read -r old; do
              [[ -z "$old" ]] && continue
              if ! printf '%s\n' "${names[@]}" | grep -Fxq -- "$old"; then
                echo "删除不在清单中的旧附件：$old"
                retry gh release delete-asset "$RELEASE_TAG" "$old" --yes \
                  || { echo "::error::删除旧附件 $old 失败"; exit 1; }
              fi
            done <<<"$existing"
          else
            echo "Release ${RELEASE_TAG} 不存在：创建（prerelease=${PRERELEASE}）"
            {
              cat limits.md
              printf '\n'
              cat packages.md
              printf '\n'
              cat checksums.md
            } > notes.md
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag \
              --title "乾元 Primus ${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              "${channel[@]}"
          fi

      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SELF_SIGNED: ${{ needs.build.outputs.selfsigned }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "\(.name)\t\(.size)")'
          state="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          [[ "$state" == "false ${PRERELEASE}" ]] || { echo "::error::Release 状态不符（draft prerelease = ${state}）"; exit 1; }
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          want=(
            "Primus_${VERSION}_arm64-setup.exe"
            "Primus_${VERSION}_arm64-setup.exe.sig"
            "Primus_${VERSION}_arm64_zh-CN.msi"
            "Primus_${VERSION}_arm64_zh-CN.msi.sig"
            "Primus_${VERSION}_x64-setup.exe"
            "Primus_${VERSION}_x64-setup.exe.sig"
            "Primus_${VERSION}_x64_zh-CN.msi"
            "Primus_${VERSION}_x64_zh-CN.msi.sig"
          )
          [[ "$SELF_SIGNED" == "true" ]] && want+=("Primus-signing-cert-arm64.cer" "Primus-signing-cert-x64.cer")
          expected="$(printf '%s\n' "${want[@]}" | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Release 附件与清单不符：${actual}"; exit 1; }
          if [[ "$PRERELEASE" != "true" ]]; then
            latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
            [[ "$latest" == "$RELEASE_TAG" ]] || { echo "::error::Latest 为 ${latest}，不是 ${RELEASE_TAG}"; exit 1; }
          fi

      # 自动更新清单（技术方案第 3.6 节、ADR 0007）：固定的 Release `update-feed`（prerelease、不设 Latest）存放
      # stable.json / beta.json，桌面端按通道读取。先下载现有清单做版本比较：正式版写 stable 与 beta（beta 只在
      # 本版本更高时覆盖），预发布只写 beta，现有版本更高的通道不覆盖；同名附件用 --clobber 覆盖上传
      - name: 更新自动更新清单（update-feed）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          feed=update-feed
          if gh release view "$feed" --json id >/dev/null 2>&1; then
            gh release edit "$feed" --prerelease --latest=false
          else
            gh release create "$feed" \
              --target "$GITHUB_SHA" \
              --title "乾元 Primus 自动更新清单" \
              --notes "供应用内自动更新读取的清单（stable.json / beta.json），由发布工作流自动维护，请勿手动修改或删除。" \
              --prerelease --latest=false
          fi
          mkdir -p feed-old feed
          # 先单独查询附件列表：查询失败就停止发布，不能当成“没有旧清单”而覆盖
          existing="$(gh release view "$feed" --json assets --jq '.assets[].name')"
          for name in stable.json beta.json; do
            if grep -Fxq -- "$name" <<<"$existing"; then
              gh release download "$feed" --pattern "$name" --dir feed-old
            fi
          done
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
          node .release-ci/scripts/gen-update-manifest.mjs \
            --version "$VERSION" --tag "$RELEASE_TAG" --repo "$GH_REPO" \
            --assets assets --out-dir feed --notes-file release-notes.md \
            --existing-stable feed-old/stable.json --existing-beta feed-old/beta.json \
            --verify > feed-files.txt
          mapfile -t written < feed-files.txt
          if [[ ${#written[@]} -eq 0 ]]; then
            echo "::notice::现有清单的版本都高于 ${VERSION}，不更新 update-feed"
            exit 0
          fi
          uploads=()
          for name in "${written[@]}"; do uploads+=("feed/${name}"); done
          if ! gh release upload "$feed" "${uploads[@]}" --clobber; then
            # --clobber 会先删同名附件；上传失败时用 feed-old 里的旧清单恢复，避免客户端读不到清单
            echo "::error::上传 update-feed 清单失败，尝试恢复旧清单"
            restore=()
            for name in "${written[@]}"; do
              [[ -f "feed-old/${name}" ]] && restore+=("feed-old/${name}")
            done
            if [[ ${#restore[@]} -gt 0 ]] && ! gh release upload "$feed" "${restore[@]}" --clobber; then
              echo "::error::恢复旧清单也失败了，请手动检查 update-feed：${restore[*]}"
            fi
            exit 1
          fi
          for name in "${written[@]}"; do
            got="$(gh release download "$feed" --pattern "$name" --output - | jq -r .version)"
            [[ "$got" == "$VERSION" ]] || { echo "::error::update-feed 中的 ${name} 版本为 ${got}，应为 ${VERSION}"; exit 1; }
            echo "✓ update-feed/${name} → ${VERSION}"
          done
